# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# A response is tied to its form by the form_name string, not a foreign key.
#
# These five make up the Report Form cohort. Their answers are laid out in
# inputs.yml so that filtering on one question leaves a predictable set on the
# others, and created_at is fixed so the date filter has something to bite on.
# rf_4 deliberately skips the text question, so the percentage base can be
# shown to be "people who answered", not "everyone".

rf_1:
  form_name: Report Form
  created_at: 2026-01-01 09:00:00

rf_2:
  form_name: Report Form
  created_at: 2026-01-02 09:00:00

rf_3:
  form_name: Report Form
  created_at: 2026-01-03 09:00:00

rf_4:
  form_name: Report Form
  created_at: 2026-01-04 09:00:00

rf_5:
  form_name: Report Form
  created_at: 2026-01-05 09:00:00

# Another form entirely. Nothing on it may ever reach a Report Form report.
other_form:
  form_name: Survey
  created_at: 2026-01-03 09:00:00
