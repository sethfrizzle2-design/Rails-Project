# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html
#
# Input has no belongs_to :question, so question_id is stamped by hand the way
# the response form does it. The "notes" question deliberately gets no inputs.
<%
  def question_id_for(label)
    ActiveRecord::FixtureSet.identify(label)
  end

  color_answers = %w[Red Red Blue]

  # Out of numeric order on purpose: "10" must not sort next to "1".
  dog_answers = %w[10 9 9 2 2 2]

  # Twenty distinct answers with distinct counts, so the top-15 cut is
  # unambiguous and the dropped five are the least common.
  food_answers = (1..20).flat_map { |n| Array.new(21 - n, format("Food %02d", n)) }
%>

<% color_answers.each_with_index do |answer, index| %>
color_<%= index %>:
  question_id: <%= question_id_for(:color) %>
  question_words: What is your favorite color?
  answer: <%= answer %>
<% end %>

<% dog_answers.each_with_index do |answer, index| %>
dogs_<%= index %>:
  question_id: <%= question_id_for(:dogs) %>
  question_words: How many dogs do you have?
  answer: "<%= answer %>"
<% end %>

<% food_answers.each_with_index do |answer, index| %>
food_<%= index %>:
  question_id: <%= question_id_for(:food) %>
  question_words: What is your favorite food?
  answer: <%= answer %>
<% end %>

# The Report Form cohort. These, unlike the survey inputs above, name a
# response, because the report counts through the response cohort rather than
# straight off the inputs table.
#
#   response | colour | dogs | note
#   ---------+--------+------+-------
#   rf_1     | Red    |  2   | Great
#   rf_2     | Red    | 10   | Great
#   rf_3     | Blue   |  2   | Fine
#   rf_4     | Blue   |  2   | (skipped)
#   rf_5     | Red    |  9   | Great

<%
  rf_rows = [
    [:rf_1, "Red",  "2",  "Great"],
    [:rf_2, "Red",  "10", "Great"],
    [:rf_3, "Blue", "2",  "Fine"],
    [:rf_4, "Blue", "2",  nil],
    [:rf_5, "Red",  "9",  "Great"]
  ]

  # Literal ids, because those questions carry explicit ids and the label
  # would resolve to the hashed one instead.
  rf_questions = { 101 => "Which colour?", 102 => "How many dogs?", 103 => "Anything else?" }
%>

<% rf_rows.each do |response, *answers| %>
<% rf_questions.keys.zip(answers).each do |question_id, answer| %>
<% next if answer.nil? %>
rf_<%= response %>_<%= question_id %>:
  response: <%= response %>
  question_id: <%= question_id %>
  question_words: <%= rf_questions[question_id] %>
  answer: "<%= answer %>"
<% end %>
<% end %>

# On the Survey form, and carrying a Report Form question id at that. If the
# cohort is ever scoped by question alone this shows up where it must not.
rf_intruder:
  response: other_form
  question_id: 101
  question_words: Which colour?
  answer: Green
