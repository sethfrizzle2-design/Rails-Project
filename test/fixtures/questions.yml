# Read about fixtures at https://api.rubyonrails.org/classes/ActiveRecord/FixtureSet.html

color:
  form: survey
  format: Multiple Choice
  words: What is your favorite color?

dogs:
  form: survey
  format: Number
  words: How many dogs do you have?

food:
  form: survey
  format: Text
  words: What is your favorite food?

notes:
  form: survey
  format: Text
  words: Any other notes?

# The question form's type select defaults to this literal string, so questions
# saved without a type picked are not chartable.
untyped:
  form: survey
  format: Select a Type
  words: Not a real question

# Explicit ids: fixture ids are otherwise hashed from the label, and a report
# lists its sections in question id order, so the order has to be pinned for
# the tests to mean anything.

rf_color:
  id: 101
  form: report_form
  format: Multiple Choice
  words: Which colour?

rf_dogs:
  id: 102
  form: report_form
  format: Number
  words: How many dogs?

rf_note:
  id: 103
  form: report_form
  format: Text
  words: Anything else?
